[package]
name = "afterbudget"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Application desktop de gestion de budget personnel"
authors = ["AfterBudget"]
license = "MIT"

[package.metadata]
repository = "https://github.com/alexandrebouttierdev/afterbudget"
keywords = ["budget", "finance", "desktop", "sqlite"]
categories = ["gui", "finance"]

[package.metadata.deb]
maintainer = "AfterBudget <alexandrebouttierdev@users.noreply.github.com>"
section = "utils"
priority = "optional"
assets = [
  ["target/release/afterbudget", "usr/bin/", "755"],
  ["packaging/afterbudget.desktop", "usr/share/applications/", "644"],
  ["packaging/afterbudget.png", "usr/share/icons/hicolor/256x256/apps/afterbudget.png", "644"],
]

[package.metadata.generate-rpm]
name = "afterbudget"
summary = "Application desktop de gestion de budget personnel"
license = "MIT"
url = "https://github.com/alexandrebouttierdev/afterbudget"
assets = [
  { source = "target/release/afterbudget", dest = "/usr/bin/afterbudget", mode = "755" },
  { source = "packaging/afterbudget.desktop", dest = "/usr/share/applications/afterbudget.desktop", mode = "644" },
  { source = "packaging/afterbudget.png", dest = "/usr/share/icons/hicolor/256x256/apps/afterbudget.png", mode = "644" },
]

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "svg", "canvas"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
rfd = "0.14"
thiserror = "1"
validator = { version = "0.19", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

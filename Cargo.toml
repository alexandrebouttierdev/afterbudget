[package]
name = "afterbudget"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Application desktop de gestion de budget personnel"
authors = ["AfterBudget"]
license = "MIT"

[package.metadata]
repository = "https://github.com/alexandrebouttierdev/afterbudget"
keywords = ["budget", "finance", "desktop", "sqlite"]
categories = ["command-line-utilities"]

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "svg", "canvas"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
rfd = "0.14"
thiserror = "1"
validator = { version = "0.19", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
